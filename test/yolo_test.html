<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YOLOv8n-Face — quick test</title>
  <style>
    body  { font-family: monospace; background: #111; color: #eee; padding: 2rem; }
    img   { max-width: 480px; border: 1px solid #555; }
    pre   { background: #222; padding: 1rem; white-space: pre-wrap; }
    h1    { font-size: 1.2rem; }
  </style>
</head>
<body>
  <h1>YOLOv8n-Face detection test</h1>
  <p>Select an image, then click <b>Run detection</b>.</p>
  <input id="file" type="file" accept="image/*" />
  <button id="run">Run detection</button>
  <br /><br />
  <img id="preview" />
  <pre id="log">Waiting…</pre>

  <!-- ONNX Runtime Web — served from node_modules or copied into the page dir -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

  <script type="module">
    /* ── inline the core helpers so the test is self-contained ── */
    const INPUT_SIZE = 1280;
    const CONF_THRESH = 0.25;
    const IOU_THRESH  = 0.45;
    const MODEL_PATH  = "yolov8n-face.onnx";   // same directory as this HTML

    let _session = null;

    async function loadModel(path) {
      if (_session) return _session;
      const t0 = performance.now();
      _session = await ort.InferenceSession.create(path || MODEL_PATH, {
        executionProviders: ["wasm"],
        graphOptimizationLevel: "all",
      });
      log(`model loaded in ${(performance.now() - t0).toFixed(1)} ms`);
      return _session;
    }

    async function detectFaces(canvas, session) {
      const sess = session || _session;
      if (!sess) throw new Error("call loadModel() first");

      const { tensor, origW, origH } = prepareInput(canvas);

      const t0 = performance.now();
      const output = await sess.run({ images: tensor });
      const ms = performance.now() - t0;
      log(`inference ${ms.toFixed(1)} ms`);

      return postprocess(output.output0.data, origW, origH);
    }

    function prepareInput(source) {
      const origW = source.width, origH = source.height;
      const scale = Math.min(INPUT_SIZE / origW, INPUT_SIZE / origH);
      const newW  = Math.round(origW * scale);
      const newH  = Math.round(origH * scale);
      const padX  = (INPUT_SIZE - newW) / 2;
      const padY  = (INPUT_SIZE - newH) / 2;

      const tmp = document.createElement("canvas");
      tmp.width = INPUT_SIZE;
      tmp.height = INPUT_SIZE;
      const ctx = tmp.getContext("2d");
      ctx.fillStyle = "114";
      ctx.fillRect(0, 0, INPUT_SIZE, INPUT_SIZE);
      ctx.drawImage(source, padX, padY, newW, newH);

      const imgData = ctx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE);
      const px = imgData.data;
      const chw = new Float32Array(3 * INPUT_SIZE * INPUT_SIZE);
      const area = INPUT_SIZE * INPUT_SIZE;
      for (let i = 0; i < area; i++) {
        const j = i * 4;
        chw[i]            = px[j + 2] / 255;
        chw[i + area]     = px[j + 1] / 255;
        chw[i + 2 * area] = px[j]     / 255;
      }
      return { tensor: new ort.Tensor("float32", chw, [1, 3, INPUT_SIZE, INPUT_SIZE]), origW, origH };
    }

    function postprocess(raw, origW, origH) {
      const C = 20, N = 8400;
      const scale = Math.min(INPUT_SIZE / origW, INPUT_SIZE / origH);
      const newW  = Math.round(origW * scale);
      const newH  = Math.round(origH * scale);
      const padX  = (INPUT_SIZE - newW) / 2;
      const padY  = (INPUT_SIZE - newH) / 2;

      const cands = [];
      for (let i = 0; i < N; i++) {
        const cx = raw[i*C], cy = raw[i*C+1], w = raw[i*C+2], h = raw[i*C+3];
        const conf = sigmoid(raw[i*C+4]) * sigmoid(raw[i*C+5]);
        if (conf < CONF_THRESH) continue;
        const x1 = Math.max(0, (cx - w/2 - padX) / scale);
        const y1 = Math.max(0, (cy - h/2 - padY) / scale);
        const x2 = Math.min(origW, (cx + w/2 - padX) / scale);
        const y2 = Math.min(origH, (cy + h/2 - padY) / scale);
        cands.push({ bbox: [Math.round(x1), Math.round(y1), x2-x1, y2-y1], confidence: conf });
      }
      return nms(cands, IOU_THRESH);
    }

    function sigmoid(v) { return 1 / (1 + Math.exp(-v)); }

    function nms(boxes, t) {
      boxes.sort((a, b) => b.confidence - a.confidence);
      const keep = [], alive = new Set(boxes.map((_, i) => i));
      for (const box of boxes) {
        const idx = boxes.indexOf(box);
        if (!alive.has(idx)) continue;
        keep.push(box);
        alive.delete(idx);
        for (const j of alive)
          if (iou(box.bbox, boxes[j].bbox) > t) alive.delete(j);
      }
      return keep;
    }

    function iou(a, b) {
      const x1 = Math.max(a[0],b[0]), y1 = Math.max(a[1],b[1]);
      const x2 = Math.min(a[0]+a[2],b[0]+b[2]), y2 = Math.min(a[1]+a[3],b[1]+b[3]);
      const inter = Math.max(0, x2-x1) * Math.max(0, y2-y1);
      return inter / (a[2]*a[3] + b[2]*b[3] - inter + 1e-6);
    }

    /* ── UI glue ──────────────────────────────────────────── */
    const logEl = document.getElementById("log");
    function log(msg) { logEl.textContent += msg + "\n"; }

    document.getElementById("run").addEventListener("click", async () => {
      const file = document.getElementById("file").files[0];
      if (!file) { alert("Pick an image first"); return; }

      logEl.textContent = "";
      const img = document.getElementById("preview");
      img.src = URL.createObjectURL(file);
      await img.decode();

      const canvas = document.createElement("canvas");
      canvas.width  = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext("2d").drawImage(img, 0, 0);

      await loadModel();
      const faces = await detectFaces(canvas);

      log(`\nDetected ${faces.length} face(s):`);
      for (const f of faces)
        log(`  bbox=[${f.bbox}]  conf=${f.confidence.toFixed(3)}`);

      // draw boxes on canvas for visual verification
      const ctx = canvas.getContext("2d");
      ctx.strokeStyle = "#0f0";
      ctx.lineWidth = 3;
      for (const f of faces) {
        ctx.strokeRect(f.bbox[0], f.bbox[1], f.bbox[2], f.bbox[3]);
        ctx.fillStyle = "#0f0";
        ctx.fillText(f.confidence.toFixed(3), f.bbox[0], f.bbox[1] - 4);
      }
      img.src = canvas.toDataURL();
    });
  </script>
</body>
</html>
